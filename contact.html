<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Hello, World!</title>
  <style>
    :root { color-scheme:dark; --ink:#f8fafc; --muted:#cbd5e1; --card:rgba(15,23,42,.7); --line:rgba(255,255,255,.14); }
    * { box-sizing:border-box; } body { min-height:100vh; margin:0; display:grid; place-items:center; font-family:Inter,ui-sans-serif,system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 12% 85%,rgba(56,189,248,.35),transparent 28rem),radial-gradient(circle at 85% 14%,rgba(167,139,250,.38),transparent 30rem),linear-gradient(135deg,#0b1022,#121a38 52%,#181036); }
    main { width:min(92%,46rem); padding:1.25rem; } nav { display:flex; justify-content:center; gap:.35rem; margin-bottom:1rem; } nav a { padding:.5rem .8rem; border-radius:999px; color:var(--muted); text-decoration:none; font-size:.9rem; transition:.18s; } nav a:hover,nav a[aria-current="page"] { background:rgba(255,255,255,.12); color:#fff; }
    .card { padding:clamp(2.2rem,7vw,4.5rem); border:1px solid var(--line); border-radius:2rem; background:var(--card); box-shadow:0 25px 80px rgba(2,6,23,.45); backdrop-filter:blur(20px); } h1 { margin:0 0 .65rem; font-size:clamp(2.7rem,8vw,5rem); letter-spacing:-.06em; line-height:1; background:linear-gradient(120deg,#fff,#67e8f9,#c4b5fd); -webkit-background-clip:text; background-clip:text; color:transparent; } p { margin:0 0 1.5rem; color:var(--muted); line-height:1.65; }
    form { display:grid; gap:1rem; } label { display:grid; gap:.45rem; color:#e2e8f0; font-size:.92rem; font-weight:650; } input,textarea { width:100%; padding:.8rem .9rem; border:1px solid var(--line); border-radius:.8rem; color:var(--ink); background:rgba(2,6,23,.35); font:inherit; } textarea { min-height:7rem; resize:vertical; } input:focus,textarea:focus { outline:2px solid #67e8f9; outline-offset:2px; } button { justify-self:start; border:0; border-radius:999px; padding:.85rem 1.2rem; color:#0f172a; background:linear-gradient(110deg,#67e8f9,#c4b5fd); cursor:pointer; font:inherit; font-weight:750; } #thanks { min-height:1.35rem; margin-top:1rem; color:#bbf7d0; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <section class="card">
      <h1>Let's connect.</h1>
      <p>Have an idea, a question, or simply want to say hello? Send a note below.</p>
      <form id="contact-form">
        <label>Name<input required name="name" autocomplete="name" placeholder="Your name" /></label>
        <label>Email<input required name="email" type="email" autocomplete="email" placeholder="you@example.com" /></label>
        <label>Message<textarea required name="message" placeholder="What's on your mind?"></textarea></label>
        <button type="submit">Send message</button>
      </form>
      <p id="thanks" aria-live="polite"></p>
    </section>
  </main>
  <script>
    document.getElementById('contact-form').addEventListener('submit', event => {
      event.preventDefault();
      document.getElementById('thanks').textContent = 'Thanks! Your message is ready to be sent.';
      event.currentTarget.reset();
    });
  </script>
</body>
</html>
