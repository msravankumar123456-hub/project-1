<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A polished Hello World page." />
  <title>Hi my name is sravan</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --card: rgba(15, 23, 42, 0.66);
      --line: rgba(255, 255, 255, 0.14);
      --accent: #a78bfa;
      --accent-2: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(56, 189, 248, 0.38), transparent 30rem),
        radial-gradient(circle at 84% 76%, rgba(167, 139, 250, 0.38), transparent 32rem),
        linear-gradient(135deg, #0b1022, #121a38 52%, #181036);
    }

    .orb {
      position: fixed;
      width: 14rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(3px);
      opacity: 0.55;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-one { top: -5rem; right: 10%; background: #38bdf8; }
    .orb-two { bottom: -7rem; left: 8%; background: #8b5cf6; animation-delay: -5s; }

    main {
      width: min(92%, 46rem);
      padding: 1.25rem;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }
    nav a { padding: 0.5rem 0.8rem; border-radius: 999px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    nav a:hover, nav a[aria-current="page"] { background: rgba(255, 255, 255, 0.12); color: white; }

    .card {
      padding: clamp(2.5rem, 8vw, 5.5rem) clamp(1.5rem, 7vw, 4.5rem);
      border: 1px solid var(--line);
      border-radius: 2rem;
      background: var(--card);
      box-shadow: 0 25px 80px rgba(2, 6, 23, 0.45);
      backdrop-filter: blur(20px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .dot {
      width: 0.6rem;
      height: 0.6rem;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 14px #4ade80;
    }

    h1 {
      margin: 1.3rem 0 0.8rem;
      font-size: clamp(3.2rem, 11vw, 6.8rem);
      line-height: 0.96;
      letter-spacing: -0.075em;
      background: linear-gradient(120deg, #ffffff 20%, var(--accent-2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 33rem;
      margin: 0 auto 2rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.18rem);
      line-height: 1.65;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 0.9rem 1.25rem;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(110deg, #67e8f9, #c4b5fd);
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.23);
      font: inherit;
      font-weight: 750;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 17px 36px rgba(167, 139, 250, 0.38); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

    #message { min-height: 1.5rem; margin: 1.2rem 0 0; color: #e9d5ff; font-size: 0.95rem; }

    @keyframes drift {
      to { transform: translate(2.5rem, 2rem) scale(1.18); }
    }

    @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }
  </style>
</head>
<body>
  <div class="orb orb-one"></div>
  <div class="orb orb-two"></div>
  <main>
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <section class="card" aria-labelledby="title">
      <div class="badge"><span class="dot"></span> Your page is live</div>
      <h1 id="title">hi my name</h1>
      <p>A small beginning with a little sparkle. Build something wonderful from here.</p>
      <button type="button" id="hello-button">Say hello back</button>
      <p id="message" aria-live="polite"></p>
    </section>
  </main>
  <script>
    document.getElementById("hello-button").addEventListener("click", () => {
      document.getElementById("message").textContent = "Hello to you too — happy creating! ✨";
    });
  </script>
</body>
</html>
